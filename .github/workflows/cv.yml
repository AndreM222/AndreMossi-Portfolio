name: CV Updater

on:
    repository_dispatch:
        types: [project_update]

permissions:
    contents: write

jobs:
    run-task:
        runs-on: ubuntu-latest
        steps:
            - name: Check out portfolio repository
              uses: actions/checkout@v4
              with:
                  ref: main

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.x'

            - name: Install dependencies
              run: python -m pip install requests

            - name: Download CV files
              run: python scripts/update_cv.py
              env:
                  SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
                  CV_REPO_TOKEN: ${{ secrets.CV_REPO_TOKEN }}
